<nav class="sticky top-0 z-50 w-full bg-header border-b border-surface-pressed">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center py-4">
      <a routerLink="/" class="flex items-center gap-2 cursor-pointer select-none">
        <img src="/logo.png" alt="Pharma Link" class="h-10 md:h-12 w-auto object-contain" />
        <span class="type-display-sm hidden sm:inline">فارما لينك</span>
      </a>

      <div class="hidden lg:flex items-center gap-2">
        <a routerLink="/" routerLinkActive="bg-primary/10 text-primary font-bold shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }" aria-current="page"
          class="inline-block type-body-md-strong text-body hover:text-ink hover:bg-surface-soft px-4 py-2 rounded-full transition-all duration-200">
          الرئيسية
        </a>
        <a routerLink="/drugs" routerLinkActive="bg-primary/10 text-primary font-bold shadow-sm"
          class="inline-block type-body-md-strong text-body hover:text-ink hover:bg-surface-soft px-4 py-2 rounded-full transition-all duration-200">
          المنتجات
        </a>
        <a routerLink="/services" routerLinkActive="bg-primary/10 text-primary font-bold shadow-sm"
          class="inline-block type-body-md-strong text-body hover:text-ink hover:bg-surface-soft px-4 py-2 rounded-full transition-all duration-200">
          الخدمات
        </a>
        <a routerLink="/contact" routerLinkActive="bg-primary/10 text-primary font-bold shadow-sm"
          class="inline-block type-body-md-strong text-body hover:text-ink hover:bg-surface-soft px-4 py-2 rounded-full transition-all duration-200">
          اتصل بنا
        </a>
        @if (isLoggedIn) {
        <a [routerLink]="dashboardPath" routerLinkActive="bg-primary/10 text-primary font-bold shadow-sm"
          class="inline-block type-body-md-strong text-body hover:text-ink hover:bg-surface-soft px-4 py-2 rounded-full transition-all duration-200">
          لوحة التحكم
        </a>
        }
      </div>

      <div class="hidden md:flex items-center gap-3">
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/auth/login" class="btn-secondary">تسجيل الدخول</a>
          <a routerLink="/auth/register" class="btn-primary">حساب جديد</a>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <!-- 👇 تم مسح الوسم القديم المفتوح للديسكتوب 👇 -->
          <a [routerLink]="getProfileLink()" class="btn-subtle gap-2 !ps-1.5 !py-1">
            <div class="w-8 h-8 rounded-full overflow-hidden border border-surface-pressed shrink-0">
              <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover">
              <div *ngIf="!profilePictureUrl"
                class="w-full h-full flex items-center justify-center bg-teal-100 text-teal-700 font-bold">
                <span>{{ fullName.charAt(0) }}</span>
              </div>
            </div>
            <span class="pe-1">{{ fullName }}</span>
          </a>
          <!-- <a routerLink="/change-password" class="btn-secondary">Change password</a> -->
          <button type="button" (click)="logout()" class="btn-primary">تسجيل الخروج</button>
        </ng-container>
      </div>

      <button type="button"
        class="md:hidden flex items-center justify-center w-10 h-10 rounded-full bg-canvas-soft text-ink"
        (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle menu">
        <i class="pi text-xl" [ngClass]="menuOpen ? 'pi-times' : 'pi-bars'"></i>
      </button>
    </div>

    <!-- Click Outside Overlay for Mobile Menu -->
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity duration-300 md:hidden" 
         [class.opacity-0]="!menuOpen"
         [class.pointer-events-none]="!menuOpen"
         (click)="menuOpen = false"
         style="top: 73px;"></div>

    <div class="md:hidden absolute top-full left-0 right-0 h-[calc(100dvh-73px)] bg-white/95 backdrop-blur-md z-50 overflow-hidden transition-all duration-300 ease-out origin-top flex flex-col shadow-xl"
         [class.opacity-0]="!menuOpen"
         [class.scale-y-95]="!menuOpen"
         [class.-translate-y-4]="!menuOpen"
         [class.pointer-events-none]="!menuOpen">
      
      <div class="p-4 sm:p-6 h-full flex flex-col justify-between overflow-y-auto custom-scrollbar pb-8">
        <nav class="flex flex-col gap-3 shrink-0">
          <a routerLink="/" routerLinkActive="!bg-teal-50 !text-teal-700 !border-teal-200" [routerLinkActiveOptions]="{exact: true}" (click)="menuOpen = false" class="px-4 py-4 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body text-right transition-colors hover:bg-slate-50">الرئيسية</a>
          <a routerLink="/drugs" routerLinkActive="!bg-teal-50 !text-teal-700 !border-teal-200" (click)="menuOpen = false" class="px-4 py-4 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body text-right transition-colors hover:bg-slate-50">المنتجات</a>
          <a routerLink="/services" routerLinkActive="!bg-teal-50 !text-teal-700 !border-teal-200" (click)="menuOpen = false" class="px-4 py-4 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body text-right transition-colors hover:bg-slate-50">الخدمات</a>
          <a routerLink="/contact" routerLinkActive="!bg-teal-50 !text-teal-700 !border-teal-200" (click)="menuOpen = false" class="px-4 py-4 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body text-right transition-colors hover:bg-slate-50">اتصل بنا</a>
          <a *ngIf="isLoggedIn" [routerLink]="dashboardPath" routerLinkActive="!bg-teal-50 !text-teal-700 !border-teal-200" (click)="menuOpen = false" class="px-4 py-4 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body text-right transition-colors hover:bg-slate-50">لوحة التحكم</a>
        </nav>

        <div class="hidden md:block flex-1"></div>

        <div class="flex flex-col justify-between flex-1 pt-6">
          <div class="flex flex-col gap-3 shrink-0 mt-auto">
            <ng-container *ngIf="!isLoggedIn">
              <a routerLink="/auth/login" (click)="menuOpen = false" class="btn-secondary w-full justify-center py-3.5 text-[0.9375rem]">تسجيل الدخول</a>
              <a routerLink="/auth/register" (click)="menuOpen = false" class="btn-primary w-full justify-center py-3.5 text-[0.9375rem]">حساب جديد</a>
            </ng-container>
            <ng-container *ngIf="isLoggedIn">
              <a [routerLink]="getProfileLink()" (click)="menuOpen = false" class="btn-subtle w-full justify-start gap-3 py-3.5">
                <div class="w-8 h-8 rounded-full overflow-hidden border border-surface-pressed shrink-0">
                  <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover">
                  <div *ngIf="!profilePictureUrl" class="w-full h-full flex items-center justify-center bg-teal-100 text-teal-700 font-bold">
                    <span>{{ fullName.charAt(0) }}</span>
                  </div>
                </div>
                <span class="font-bold">{{ fullName }}</span>
              </a>
              <a [routerLink]="getChangePasswordLink()" (click)="menuOpen = false" class="btn-secondary w-full justify-center py-3.5 text-[0.9375rem]">تغيير كلمة المرور</a>
              <button type="button" (click)="logout(); menuOpen = false" class="btn-primary w-full justify-center py-3.5 text-[0.9375rem]">تسجيل الخروج</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
