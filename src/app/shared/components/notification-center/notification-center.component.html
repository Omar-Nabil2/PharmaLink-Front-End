<div class="relative">
  <!-- Trigger Button -->
  <button (click)="goToNotifications()" class="relative w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition border border-slate-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-teal-500" title="الإشعارات">
    <i class="pi pi-bell text-xl"></i>
    <span *ngIf="unreadCount > 0" class="absolute -top-1 -right-1 w-5 h-5 flex items-center justify-center bg-red-500 text-white text-xs font-bold rounded-full">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>
</div>
