<aside class="w-64 h-full bg-canvas border-e border-surface-pressed flex flex-col pt-6">
  <div class="px-6 mb-6 flex items-center gap-2">
    <img src="/logo.png" alt="Pharma Link" class="h-8 w-auto object-contain" />
    <span class="type-display-sm text-ink hidden sm:inline">فارما لينك</span>
  </div>

  <nav class="flex-1 px-4 pb-4 overflow-y-auto">
    @for (item of items; track item.routerLink; let i = $index) {
      @if (shouldShowSection(i)) {
        <div class="px-3 pt-4 pb-2 text-[11px] font-black uppercase tracking-wide text-mute">
          {{ item.section }}
        </div>
      }

      <a
        [routerLink]="item.routerLink"
        routerLinkActive="bg-primary/10 text-primary border-s-4 border-primary active"
        [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-md text-body type-body-md-strong [&:not(.active)]:hover:bg-canvas-soft [&:not(.active)]:hover:text-ink transition-colors border-s-4 border-transparent"
      >
        @if (item.icon) {
          <i [class]="item.icon + ' text-lg'"></i>
        }
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 border-t border-surface-pressed flex items-center gap-3">
    <p-avatar
      [label]="fullName ? fullName.charAt(0).toUpperCase() : 'U'"
      shape="circle"
      styleClass="bg-canvas-soft text-ink">
    </p-avatar>
    <div class="flex-1 overflow-hidden">
      <p class="type-body-sm-strong text-ink truncate">{{ fullName }}</p>
      <p class="type-caption text-mute truncate">{{ authService.userRole() || roleName }}</p>
    </div>
  </div>
</aside>
