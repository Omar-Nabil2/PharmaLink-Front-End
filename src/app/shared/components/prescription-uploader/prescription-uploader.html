<div class="bg-blue-50/30 rounded-xl p-5 border border-blue-100">
  <div class="flex items-start gap-4 mb-4">
    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
    </div>
    <div>
      <h3 class="font-bold text-gray-800 text-lg">مطلوب روشتة طبية</h3>
      <p class="text-sm text-gray-600 mt-1">يحتوي طلبك على أدوية تستلزم وصفة طبية (روشتة). يرجى إرفاق صورة واضحة للروشتة لإتمام الطلب.</p>
    </div>
  </div>

  <!-- Upload Area -->
  <div *ngIf="!selectedFile" 
       class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-white hover:bg-gray-50 transition-colors cursor-pointer relative">
    <input type="file" 
           class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
           accept=".jpg,.jpeg,.png,.pdf"
           capture="environment"
           (change)="onFileSelected($event)">
    <div class="text-teal-600 mb-3">
      <svg class="w-10 h-10 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
      </svg>
    </div>
    <p class="text-gray-700 font-medium mb-1">اضغط هنا لرفع الروشتة</p>
    <p class="text-gray-500 text-xs">صيغ الملفات المدعومة: JPG, PNG, PDF (بحد أقصى 5 ميجابايت)</p>
  </div>

  <!-- File Preview & Upload Progress -->
  <div *ngIf="selectedFile" class="bg-white rounded-xl p-4 border border-gray-200">
    <div class="flex items-center gap-4">
      <div *ngIf="selectedFileUrl" class="w-16 h-16 rounded-lg bg-gray-100 overflow-hidden shrink-0 border border-gray-200">
        <img [src]="selectedFileUrl" class="w-full h-full object-cover" alt="Prescription preview">
      </div>
      <div *ngIf="!selectedFileUrl" class="w-16 h-16 rounded-lg bg-gray-100 flex items-center justify-center shrink-0 border border-gray-200 text-red-500">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
      </div>

      <div class="flex-1 overflow-hidden">
        <p class="text-sm font-medium text-gray-800 truncate">{{ selectedFile.name }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ (selectedFile.size / 1024 / 1024).toFixed(2) }} MB</p>
        
        <!-- Progress Bar -->
        <div *ngIf="isUploading || uploadProgress === 100" class="w-full bg-gray-200 rounded-full h-1.5 mt-2">
          <div class="bg-teal-600 h-1.5 rounded-full transition-all duration-300" [style.width.%]="uploadProgress"></div>
        </div>
      </div>

      <div class="flex flex-col gap-2 shrink-0">
        <button *ngIf="!isUploading && uploadProgress !== 100" 
                (click)="removeFile()" 
                class="text-gray-400 hover:text-red-500 p-1 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
        <button *ngIf="!isUploading && uploadProgress !== 100" 
                (click)="uploadFile()" 
                class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-medium py-1.5 px-3 rounded-lg transition-colors shadow-sm">
          تأكيد الرفع
        </button>
        <span *ngIf="uploadProgress === 100" class="text-green-600 flex items-center gap-1 text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          تم
        </span>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="uploadError" class="mt-3 text-red-600 text-sm font-medium bg-red-50 p-2 rounded-lg flex items-start gap-2">
    <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    {{ uploadError }}
  </div>
</div>
