<div class="patient-theme h-[100dvh] overflow-y-scroll overflow-x-hidden bg-slate-50 flex flex-col" style="font-family: var(--font-text)" dir="rtl">
  
  <!-- Global Click Outside Overlay for mobile menu and user menu -->
  <div *ngIf="menuOpen() || userMenuOpen()" class="fixed inset-0 z-40" (click)="menuOpen.set(false); userMenuOpen.set(false)"></div>

  <!-- Unified Top Bar -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm shrink-0">
    <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 sm:px-6 h-16 md:h-20">
      
      <!-- Logo & Brand -->
      <a routerLink="/review-team/dashboard" class="flex items-center gap-2 shrink-0">
        <img src="/logo.png" alt="Pharma Link" class="h-10 md:h-12 w-auto object-contain" />
        <div class="hidden sm:block leading-tight">
          <span class="block text-lg font-bold text-teal-700">تيم المراجعة</span>
          <span class="block text-xs font-semibold text-slate-500">فارما لينك</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center justify-center gap-1 flex-1 px-4">
        @for (item of navItems; track item.routerLink) {
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="bg-teal-50 text-teal-700 active-nav-link"
            class="px-4 py-2 rounded-full text-sm font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition [&.active-nav-link]:text-teal-700"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <!-- Right side actions (Profile & Mobile Toggle) -->
      <div class="flex items-center gap-3 shrink-0">
        <!-- User dropdown -->
        <div class="relative">
          <div (click)="toggleUserMenu()" class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 rounded-full px-2 py-1.5 transition border border-transparent hover:border-slate-200">
            @if (!profilePictureUrl) {
              <div class="h-9 w-9 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold">
                {{ avatarInitial() }}
              </div>
            }
            @if (profilePictureUrl) {
              <div class="h-9 w-9 rounded-full overflow-hidden border border-teal-200">
                <img [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover">
              </div>
            }
            <div class="hidden sm:block">
              <p class="text-[0.9375rem] font-medium text-slate-800 leading-tight">{{ fullName() }}</p>
            </div>
            <i class="pi pi-chevron-down text-xs text-slate-400"></i>
          </div>

            <!-- Click Outside Overlay -->
            <div class="fixed inset-0 z-40" (click)="userMenuOpen.set(false)" [class.hidden]="!userMenuOpen()"></div>
            <!-- Dropdown Menu -->
            <div class="absolute left-0 mt-2 w-48 bg-white border border-slate-100 rounded-xl shadow-xl py-2 z-50 transition-all duration-200 origin-top-left"
                 [class.opacity-0]="!userMenuOpen()"
                 [class.scale-95]="!userMenuOpen()"
                 [class.pointer-events-none]="!userMenuOpen()"
                 [class.-translate-y-2]="!userMenuOpen()">
              <a routerLink="/review-team/profile" (click)="toggleUserMenu()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition">
                <i class="pi pi-user text-slate-400"></i>
                الملف الشخصي
              </a>
              <div class="h-px bg-slate-50 my-1"></div>
              <button type="button" (click)="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition text-right">
                <i class="pi pi-sign-out"></i>
                تسجيل الخروج
              </button>
            </div>
        </div>

        <!-- Mobile Menu Toggle -->
        <button type="button" (click)="menuOpen.set(!menuOpen())" class="lg:hidden h-10 w-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center hover:bg-slate-200 transition">
          <i class="pi text-lg" [ngClass]="menuOpen() ? 'pi-times' : 'pi-bars'"></i>
        </button>
      </div>

    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="menuOpen()" class="lg:hidden border-t border-slate-200 bg-white py-4 px-4 absolute w-full left-0 shadow-md z-50">
      <nav class="flex flex-col gap-2">
        @for (item of navItems; track item.routerLink) {
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="bg-teal-50 text-teal-700 border-teal-200"
            (click)="menuOpen.set(false)"
            class="rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 text-sm font-bold text-slate-700 transition"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-grow w-full">
    <div class="mx-auto max-w-7xl px-5 py-8 min-h-[calc(100vh-80px)]">
      <div class="relative w-full" [@routeAnimations]="prepareRoute(outlet)">
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </div>
  </main>

</div>
