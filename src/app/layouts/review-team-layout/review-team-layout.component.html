<div class="h-screen overflow-y-scroll overflow-x-hidden bg-slate-50 font-sans" dir="rtl">
  <app-navbar class="sticky top-0 z-50 block w-full bg-white shadow-sm" />

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-5 px-5 py-6 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="mb-1 text-sm font-semibold text-teal-700">بوابة تيم الصيادلة للمراجعة</p>
        <h1 class="text-2xl font-bold text-slate-950">مراجعة الروشتات ونتائج الذكاء الاصطناعي</h1>
      </div>

      <nav class="flex flex-wrap gap-2">
        @for (item of navItems; track item.routerLink) {
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="active-review-link"
            class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-teal-600 hover:text-teal-700"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-8">
    <div class="relative w-full h-full" [@routeAnimations]="prepareRoute(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </main>
</div>
