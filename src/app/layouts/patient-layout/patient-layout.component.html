<div class="patient-theme min-h-screen bg-canvas-softer font-sans flex flex-col" dir="rtl">
  <header class="sticky top-0 z-50 bg-canvas/95 backdrop-blur border-b border-surface-pressed">
    <div class="w-full px-4 sm:px-6 lg:px-8">
      <div class="h-20 flex items-center justify-between gap-4">
        <a routerLink="/patient/dashboard" class="flex items-center gap-3 shrink-0">
          <img src="/logo.png" alt="Pharma Link" class="h-10 w-auto object-contain" />
          <div class="leading-tight">
            <span class="block text-lg font-black text-ink">فارما لينك</span>
            <span class="block text-xs text-mute">بوابة المريض</span>
          </div>
        </a>

        <nav class="hidden xl:flex items-center gap-1">
          <a *ngFor="let item of patientNavItems"
             [routerLink]="item.routerLink"
             routerLinkActive="bg-primary/10 text-primary"
             class="px-4 py-2 rounded-full text-sm font-bold text-body hover:bg-canvas-soft hover:text-ink transition">
            {{ item.label }}
          </a>
        </nav>

        <!-- Actions Area -->
        <div class="flex items-center gap-2">
          
          <!-- Always Visible Cart -->
          <a routerLink="/patient/cart" class="relative w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 transition" aria-label="السلة">
            <i class="pi pi-shopping-cart text-lg"></i>
            <span *ngIf="(cartCount$ | async) as count" class="absolute -top-1 -right-1 flex items-center justify-center min-w-[20px] h-5 px-1 text-[10px] font-bold text-white bg-red-500 rounded-full border-2 border-white shadow-sm">
              {{ count }}
            </span>
          </a>

          <!-- Desktop Actions -->
          <div class="hidden md:flex items-center gap-2">
            <a routerLink="/patient/image-search" class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 transition" aria-label="فحص دواء">
              <i class="pi pi-camera text-lg"></i>
            </a>
            
            <a routerLink="/patient/prescriptions/upload" class="flex items-center gap-2 px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-full font-bold transition shadow-sm">
              <i class="pi pi-upload"></i>
              <span class="hidden xl:inline text-sm">رفع روشتة</span>
            </a>

            <!-- Profile Dropdown -->
            <div class="relative mr-1">
              <button (click)="toggleProfileMenu()" class="flex items-center gap-2 px-2 py-1.5 rounded-full hover:bg-slate-100 transition border border-transparent hover:border-slate-200 cursor-pointer">
                <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold overflow-hidden border border-slate-200 shrink-0">
                  <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover">
                  <span *ngIf="!profilePictureUrl">{{ fullName.charAt(0) }}</span>
                </div>
                <span class="text-sm font-bold text-slate-800 max-w-[100px] truncate hidden xl:inline">{{ fullName }}</span>
                <i class="pi pi-chevron-down text-xs text-slate-400"></i>
              </button>

              <!-- Click Outside Overlay -->
              <div *ngIf="profileMenuOpen" class="fixed inset-0 z-40" (click)="profileMenuOpen = false"></div>

              <!-- Dropdown Menu -->
              <div *ngIf="profileMenuOpen" class="absolute left-0 top-full mt-2 w-48 bg-white border border-gray-100 rounded-xl shadow-xl py-2 z-50">

                <a routerLink="/patient/profile" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition cursor-pointer" (click)="profileMenuOpen = false">
                  <i class="pi pi-user text-slate-400"></i>
                  الملف الشخصي
                </a>
                <div class="h-px bg-gray-50 my-1"></div>
                <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition text-right cursor-pointer">
                  <i class="pi pi-sign-out"></i>
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </div>

          <!-- Mobile Menu Button -->
          <button type="button"
                  class="xl:hidden w-10 h-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center hover:bg-slate-200 transition"
                  (click)="menuOpen = !menuOpen"
                  [attr.aria-expanded]="menuOpen"
                  aria-label="فتح القائمة">
            <i class="pi text-lg" [ngClass]="menuOpen ? 'pi-times' : 'pi-bars'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="menuOpen" class="xl:hidden border-t border-surface-pressed py-4 space-y-3">
        <nav class="grid grid-cols-2 gap-2">
          <a *ngFor="let item of patientNavItems"
             [routerLink]="item.routerLink"
             (click)="menuOpen = false"
             class="px-3 py-3 rounded-xl bg-white border border-surface-pressed text-sm font-bold text-body">
            {{ item.label }}
          </a>
        </nav>

        <div class="grid grid-cols-1 gap-2 pt-2 md:hidden">
          <a routerLink="/patient/prescriptions/upload" (click)="menuOpen = false" class="btn-primary w-full justify-center">رفع روشتة</a>

          <a routerLink="/patient/image-search" (click)="menuOpen = false" class="btn-subtle w-full justify-center">فحص صورة دواء</a>
          <a routerLink="/patient/cart" (click)="menuOpen = false" class="btn-subtle w-full justify-center relative">
            سلة المشتريات
            <span *ngIf="(cartCount$ | async) as count" class="absolute left-4 flex items-center justify-center min-w-[20px] h-5 px-1.5 text-[11px] font-bold text-white bg-red-500 rounded-full">
              {{ count }}
            </span>
          </a>
          
          <div class="h-px bg-surface-pressed my-2 mx-1"></div>
          

          
          <a routerLink="/patient/profile" (click)="menuOpen = false" class="px-4 py-3 flex items-center gap-3 text-body hover:bg-canvas-soft border border-transparent rounded-xl transition cursor-pointer">
            <div class="w-6 h-6 rounded-full overflow-hidden bg-slate-100 flex items-center justify-center shrink-0 border border-slate-200">
               <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover">
               <span *ngIf="!profilePictureUrl" class="text-teal-700 font-bold text-xs">{{ fullName.charAt(0) }}</span>
            </div>
            الملف الشخصي
          </a>
          <button (click)="logout()" class="w-full text-right px-4 py-3 flex items-center gap-3 text-red-600 hover:bg-red-50 border border-transparent rounded-xl transition cursor-pointer">
            <i class="pi pi-sign-out"></i>
            تسجيل الخروج
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow overflow-x-clip">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 min-h-[calc(100vh-80px)]">
      <div class="relative w-full" [@routeAnimations]="prepareRoute(outlet)">
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </div>
  </main>

  <!-- Sticky AI Assistant Button -->
  <a *ngIf="!isAiAssistantPage()" routerLink="/patient/ai-assistant" 
     class="fixed bottom-6 left-6 z-50 flex items-center justify-center w-14 h-14 bg-gradient-to-r from-teal-500 to-teal-700 text-white rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300"
     title="المساعد الذكي">
    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5 2.5 2.5 0 0 0 7.5 18 2.5 2.5 0 0 0 10 15.5 2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0 2.5 2.5 2.5 2.5 0 0 0 2.5-2.5 2.5 2.5 0 0 0-2.5-2.5z"/></svg>
  </a>
</div>
