<p-toast />
<router-outlet></router-outlet>

<!-- Global PWA Install Banner -->
<div *ngIf="pwaInstall.promptSaved$ | async" 
     class="fixed bottom-0 left-0 right-0 z-[9999] bg-gradient-to-r from-teal-600 to-teal-800 text-white px-4 py-4 flex items-center justify-between shadow-[0_-4px_15px_rgba(0,0,0,0.1)] rounded-t-2xl m-0" 
     dir="rtl">
  <div class="flex items-center gap-3 w-full">
    <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shrink-0 p-1 shadow-sm">
      <img src="/icons/icon-72x72.png" alt="App Icon" class="w-full h-full object-contain" onerror="this.src='/logo.png'">
    </div>
    <div class="flex-grow">
      <p class="font-bold text-sm leading-tight text-white mb-1">تطبيق فارما لينك</p>
      <p class="text-[11px] text-teal-100 leading-tight">ثبّت التطبيق لتجربة أسرع وإشعارات أفضل!</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button (click)="pwaInstall.dismissPrompt()" class="w-8 h-8 flex items-center justify-center rounded-full bg-teal-800/50 hover:bg-teal-900 transition text-teal-100">
        <i class="pi pi-times text-xs"></i>
      </button>
      <button (click)="pwaInstall.installPwa()" class="bg-white text-teal-700 px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg hover:bg-gray-50 hover:scale-105 transition transform active:scale-95">
        تثبيت
      </button>
    </div>
  </div>
</div>
