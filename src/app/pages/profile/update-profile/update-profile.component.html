<div class="max-w-2xl mx-auto p-6 lg:p-8" dir="rtl">
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">تعديل الملف الشخصي</h1>
            <p class="text-slate-500 mt-2">تحديث معلوماتك الشخصية.</p>
        </div>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isFetching" class="flex justify-center items-center py-20">
        <i class="pi pi-spinner animate-spin text-4xl text-emerald-600"></i>
    </div>

    <!-- Patient Profile Picture Section -->
    <div *ngIf="!isFetching && isPatient" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-6 flex flex-col md:flex-row items-center gap-6">
        <div class="relative w-32 h-32 shrink-0">
            <img *ngIf="imagePreview" [src]="imagePreview" alt="Profile" class="w-full h-full rounded-full object-cover border-4 border-white shadow-md" />
            <div *ngIf="!imagePreview" class="bg-emerald-100 text-emerald-700 w-full h-full rounded-full flex items-center justify-center font-bold text-4xl border-4 border-white shadow-md">
                {{ fullNameForAvatar?.charAt(0) || 'U' }}
            </div>
        </div>
        <div class="flex-grow flex flex-col gap-3 w-full md:w-auto">
            <h3 class="font-bold text-slate-800 text-lg">الصورة الشخصية</h3>
            <p class="text-sm text-slate-500 mb-2">اختر صورة مناسبة لملفك الشخصي.</p>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden" />
                <button type="button" (click)="fileInput.click()" class="px-5 py-2.5 rounded-xl font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 transition-colors flex justify-center items-center gap-2">
                    <i class="pi pi-image"></i> اختر صورة
                </button>
                <button *ngIf="selectedFile" (click)="uploadPicture()" [disabled]="isUploadingPicture" class="px-5 py-2.5 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors flex justify-center items-center gap-2 shadow-sm disabled:opacity-70 disabled:cursor-not-allowed">
                    <i *ngIf="isUploadingPicture" class="pi pi-spinner animate-spin"></i>
                    <i *ngIf="!isUploadingPicture" class="pi pi-upload"></i> رفع الصورة
                </button>
            </div>
        </div>
    </div>

    <!-- Form Area -->
    <div *ngIf="!isFetching" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
        <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="space-y-6">

            <div>
                <label for="fullName" class="block text-sm font-semibold text-slate-700 mb-1">الاسم الكامل</label>
                <input id="fullName" type="text" formControlName="fullName"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm"
                    [ngClass]="{'border-red-500 focus:ring-red-500': updateForm.get('fullName')?.invalid && updateForm.get('fullName')?.touched}">

                <div *ngIf="updateForm.get('fullName')?.invalid && updateForm.get('fullName')?.touched"
                    class="text-red-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="pi pi-exclamation-circle"></i>
                    <span>الاسم الكامل مطلوب (3 أحرف على الأقل).</span>
                </div>
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm font-semibold text-slate-700 mb-1">رقم الهاتف</label>
                <input id="phoneNumber" type="text" formControlName="phoneNumber"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm"
                    [ngClass]="{'border-red-500 focus:ring-red-500': updateForm.get('phoneNumber')?.invalid && updateForm.get('phoneNumber')?.touched}">

                <div *ngIf="updateForm.get('phoneNumber')?.invalid && updateForm.get('phoneNumber')?.touched"
                    class="text-red-500 text-xs mt-1.5 flex flex-col gap-1">
                    <div *ngIf="updateForm.get('phoneNumber')?.errors?.['required']" class="flex items-center gap-1">
                        <i class="pi pi-exclamation-circle"></i>
                        <span>رقم الهاتف مطلوب.</span>
                    </div>
                    <div *ngIf="updateForm.get('phoneNumber')?.errors?.['pattern']" class="flex items-center gap-1">
                        <i class="pi pi-exclamation-circle"></i>
                        <span>يرجى إدخال رقم هاتف مصري صحيح.</span>
                    </div>
                </div>
            </div>

            <div *ngIf="isDriver">
                <label for="vehicleInfo" class="block text-sm font-semibold text-slate-700 mb-1">بيانات المركبة
                    (الموتوسيكل)</label>
                <input id="vehicleInfo" type="text" formControlName="vehicleInfo"
                    placeholder="مثال: هوندا أحمر - رقم اللوحة أ ب ج 123"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm"
                    [ngClass]="{'border-red-500 focus:ring-red-500': updateForm.get('vehicleInfo')?.invalid && updateForm.get('vehicleInfo')?.touched}">

                <div *ngIf="updateForm.get('vehicleInfo')?.invalid && updateForm.get('vehicleInfo')?.touched"
                    class="text-red-500 text-xs mt-1.5 flex items-center gap-1">
                    <i class="pi pi-exclamation-circle"></i>
                    <span>بيانات المركبة مطلوبة.</span>
                </div>
            </div>

            <div *ngIf="isPharmacyAdmin"
                class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 mt-2 border-t border-slate-100 opacity-80">
                <div>
                    <label class="block text-sm font-semibold text-slate-500 mb-1">البريد الإلكتروني (غير قابل
                        للتعديل)</label>
                    <input type="email" formControlName="email" dir="ltr"
                        class="w-full text-right px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 outline-none cursor-not-allowed shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-500 mb-1">اسم الصيدلية (غير قابل
                        للتعديل)</label>
                    <input type="text" formControlName="legalName"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 outline-none cursor-not-allowed shadow-sm">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-end gap-3 pt-4 mt-6 border-t border-slate-100">
                <!-- زرار الإلغاء بيرجعنا للبروفايل برضه -->
                <a [routerLink]="getProfileLink()"
                    class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                    إلغاء
                </a>
                <button type="submit" [disabled]="updateForm.invalid || isLoading" class="btn-primary">
                    <i *ngIf="isLoading" class="pi pi-spinner animate-spin"></i>
                    <span>{{ isLoading ? 'جاري الحفظ...' : 'حفظ التغييرات' }}</span>
                </button>
            </div>

        </form>
    </div>
</div>
