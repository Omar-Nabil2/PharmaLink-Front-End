<div class="w-full" dir="rtl">
  <!-- Header Section -->
  <div class="mb-8">
    <a routerLink="/patient/addresses" class="group inline-flex items-center gap-2 text-slate-500 hover:text-teal-600 font-medium text-sm mb-4 transition-all duration-300">
      <i class="pi pi-arrow-right group-hover:-translate-x-1 transition-transform"></i>
      <span>العودة لقائمة العناوين</span>
    </a>
    
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-teal-600/10 flex items-center justify-center text-teal-600">
        <i class="pi pi-map-marker text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">
          {{ isEditMode ? 'تعديل العنوان' : 'إضافة عنوان جديد' }}
        </h1>
        <p class="text-slate-500 font-medium mt-1 text-sm">
          أدخل تفاصيل العنوان الجديد بدقة لضمان وصول طلباتك بأسرع وقت.
        </p>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm">
    <div class="relative w-12 h-12">
      <div class="absolute inset-0 rounded-full border-4 border-teal-100"></div>
      <div class="absolute inset-0 rounded-full border-4 border-teal-600 border-t-transparent animate-spin"></div>
    </div>
    <p class="mt-4 text-teal-800 font-bold animate-pulse">جاري التحميل...</p>
  </div>

  <!-- Main Form Card -->
  <div *ngIf="!isLoading" class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden relative">
    <div class="h-1 w-full bg-gradient-to-r from-teal-400 to-blue-500"></div>

    <form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="p-6 md:p-8">
      
      <!-- Label Section -->
      <div class="mb-8 group">
        <label for="label" class="block text-slate-700 font-bold text-sm mb-3">تسمية العنوان (اختياري)</label>
        
        <!-- Suggestions -->
        <div class="flex flex-wrap gap-3 mb-3">
          <button type="button" (click)="setLabel('المنزل')" class="px-5 py-2 rounded-xl border-2 text-sm font-bold flex items-center gap-2 transition-all" [ngClass]="addressForm.get('label')?.value === 'المنزل' ? 'border-teal-600 bg-teal-50 text-teal-700' : 'border-slate-100 bg-slate-50 text-slate-600 hover:border-slate-300'">
            <i class="pi pi-home"></i> المنزل
          </button>
          <button type="button" (click)="setLabel('العمل')" class="px-5 py-2 rounded-xl border-2 text-sm font-bold flex items-center gap-2 transition-all" [ngClass]="addressForm.get('label')?.value === 'العمل' ? 'border-teal-600 bg-teal-50 text-teal-700' : 'border-slate-100 bg-slate-50 text-slate-600 hover:border-slate-300'">
            <i class="pi pi-briefcase"></i> العمل
          </button>
        </div>

        <div class="relative">
          <input 
            type="text" 
            id="label" 
            formControlName="label"
            class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300"
            placeholder="مثال: منزل العائلة، العيادة، إلخ..."
          >
          <i class="pi pi-tag absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-teal-500"></i>
        </div>
      </div>

      <!-- Address Line -->
      <div class="mb-6 group">
        <label for="addressLine" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">
          اسم الشارع / المنطقة التفصيلية <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="addressLine" 
            formControlName="addressLine"
            class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300"
            placeholder="مثال: شارع جامعة الدول العربية"
            [ngClass]="{'border-red-400 bg-red-50 focus:border-red-500 focus:ring-red-500/10': isFieldInvalid('addressLine')}"
          >
          <i class="pi pi-directions absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-teal-500"></i>
        </div>
        <div *ngIf="isFieldInvalid('addressLine')" class="text-red-500 text-xs font-bold mt-1">
          هذا الحقل مطلوب (5 أحرف على الأقل)
        </div>
      </div>

      <!-- 2-Column Grid for Details -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        
        <!-- Governorate -->
        <div class="group">
          <label for="governorate" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">
            المحافظة <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <select 
              id="governorate" 
              formControlName="governorate"
              class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 pr-10 text-slate-800 appearance-none focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300"
              [ngClass]="{'border-red-400 bg-red-50': isFieldInvalid('governorate')}"
            >
              <option value="" disabled selected>اختر المحافظة...</option>
              <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
            </select>
            <i class="pi pi-map absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-teal-500"></i>
            <i class="pi pi-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          </div>
        </div>

        <!-- City -->
        <div class="group">
          <label for="city" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">
            المدينة / الحي <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="city" 
              formControlName="city"
              class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300"
              placeholder="مثال: المهندسين"
              [ngClass]="{'border-red-400 bg-red-50': isFieldInvalid('city')}"
            >
            <i class="pi pi-compass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-teal-500"></i>
          </div>
        </div>

        <!-- Building Number -->
        <div class="group">
          <label for="buildingNumber" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">
            رقم المبنى / العمارة
          </label>
          <div class="relative">
            <input type="text" id="buildingNumber" formControlName="buildingNumber" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300" placeholder="مثال: 15">
            <i class="pi pi-building absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-teal-500"></i>
          </div>
        </div>

        <!-- Floor & Apartment Row -->
        <div class="grid grid-cols-2 gap-4">
          <div class="group">
            <label for="floorNumber" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">الدور</label>
            <input type="text" id="floorNumber" formControlName="floorNumber" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300" placeholder="مثال: 3">
          </div>
          <div class="group">
            <label for="apartmentNumber" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">رقم الشقة</label>
            <input type="text" id="apartmentNumber" formControlName="apartmentNumber" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300" placeholder="مثال: 12">
          </div>
        </div>
      </div>

      <!-- Additional Instructions -->
      <div class="mb-8 group">
        <label for="additionalInstructions" class="block text-slate-700 font-bold text-sm mb-2 group-focus-within:text-teal-600 transition-colors">
          علامة مميزة / تعليمات التوصيل
        </label>
        <textarea id="additionalInstructions" formControlName="additionalInstructions" rows="2" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 transition-all duration-300 resize-none" placeholder="مثال: بجوار صيدلية كذا، أو الاتصال قبل الوصول..."></textarea>
      </div>

      <!-- Location Box -->
      <div class="mb-8 p-5 rounded-2xl bg-blue-50 border border-blue-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h3 class="text-sm font-bold text-blue-900 mb-1 flex items-center gap-2">
            تحديد الموقع الجغرافي <span class="bg-blue-200 text-blue-800 text-[10px] px-2 py-0.5 rounded-full">موصى به</span>
          </h3>
          <p class="text-blue-700/80 text-xs font-medium">يساعد مندوب التوصيل في الوصول إليك بدقة.</p>
        </div>
        <button type="button" (click)="getCurrentLocation()" class="shrink-0 px-4 py-2.5 rounded-xl bg-white text-blue-600 font-bold text-sm border border-blue-200 hover:bg-blue-100 transition-colors flex items-center justify-center gap-2">
          <i class="pi pi-map-marker"></i> الحصول على موقعي
        </button>
      </div>
      <div *ngIf="addressForm.get('latitude')?.value && addressForm.get('latitude')?.value !== 0" class="mb-8 -mt-4 text-emerald-600 text-sm font-bold flex items-center gap-2">
        <i class="pi pi-check-circle"></i> تم التقاط الموقع بنجاح.
      </div>

      <!-- Default Address Toggle -->
      <div class="mb-8 border-t border-slate-100 pt-6">
        <label class="flex items-center gap-3 cursor-pointer group w-fit">
          <div class="relative flex items-center">
            <input type="checkbox" formControlName="isDefault" class="peer sr-only">
            <div class="w-5 h-5 border-2 border-slate-300 rounded bg-slate-50 peer-checked:bg-teal-600 peer-checked:border-teal-600 flex items-center justify-center transition-all">
              <i class="pi pi-check text-white text-xs opacity-0 peer-checked:opacity-100 font-bold"></i>
            </div>
          </div>
          <span class="text-slate-800 font-bold text-sm">تعيين كعنوان افتراضي للطلبات القادمة</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <button type="submit" class="px-8 py-3 rounded-xl bg-teal-600 text-white font-bold text-sm hover:bg-teal-700 transition-colors flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed" [disabled]="isSubmitting">
          <i class="pi pi-spinner animate-spin" *ngIf="isSubmitting"></i>
          <i class="pi pi-save" *ngIf="!isSubmitting"></i>
          {{ isSubmitting ? 'جاري الحفظ...' : 'حفظ العنوان' }}
        </button>
        <a routerLink="/patient/addresses" class="px-8 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200 transition-colors">
          إلغاء
        </a>
      </div>
      
    </form>
  </div>
</div>
