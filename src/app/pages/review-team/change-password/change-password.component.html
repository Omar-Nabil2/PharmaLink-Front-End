<div class="max-w-2xl mx-auto p-4 lg:p-6" dir="rtl">
  <div class="mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">تغيير كلمة المرور</h1>
      <p class="text-slate-500 mt-2">قم بتحديث كلمة المرور الخاصة بحسابك.</p>
    </div>
  </div>

  <p-toast></p-toast>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
      <h3 class="font-bold text-slate-800">بيانات كلمة المرور</h3>
    </div>
    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور الحالية</label>
        <input type="password" [(ngModel)]="currentPassword" 
               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="newPassword" 
               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">تأكيد كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="confirmPassword" 
               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all shadow-sm" />
      </div>

      <div class="pt-4 mt-6 border-t border-slate-100 flex justify-end gap-3">
        <a routerLink="/review-team/profile"
           class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-colors inline-flex items-center">
          إلغاء
        </a>
        <button (click)="updatePassword()" [disabled]="isUpdatingPassword()" 
                class="px-6 py-2.5 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors flex items-center gap-2 shadow-sm disabled:opacity-70 disabled:cursor-not-allowed">
          <i *ngIf="isUpdatingPassword()" class="pi pi-spinner animate-spin"></i>
          <i *ngIf="!isUpdatingPassword()" class="pi pi-key"></i>
          <span>تغيير كلمة المرور</span>
        </button>
      </div>
    </div>
  </div>
</div>
